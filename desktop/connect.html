<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Connect to a server</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5fb;
        --text: #1b1e30;
        --dim: #62688a;
        --field: #fff;
        --line: #d6daea;
        --accent: #3d63e8;
        --err: #c0392b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141726;
          --text: #eceef6;
          --dim: #9aa1b8;
          --field: #0b0d18;
          --line: #2a2f45;
          --accent: #7ea2ff;
          --err: #ff8686;
        }
      }
      body {
        margin: 0;
        padding: 22px;
        font:
          13px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      p {
        margin: 0 0 14px;
        color: var(--dim);
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--field);
        color: var(--text);
        font: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      }
      button {
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      #err {
        min-height: 18px;
        margin-top: 6px;
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <form id="form">
      <h1>Connect to a CodeBase server</h1>
      <p>Use your account and publish sites from the desktop app. Projects saved offline stay on this computer.</p>
      <input id="url" placeholder="https://codebase.example.com" spellcheck="false" autofocus />
      <div id="err"></div>
      <div class="row">
        <button type="button" id="cancel">Cancel</button>
        <button class="primary">Connect</button>
      </div>
    </form>
    <script src="connect.js"></script>
  </body>
</html>
